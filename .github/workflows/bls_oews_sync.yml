name: BLS OEWS wage sync

# Stages Atlanta (12060) OEWS median hourly wages into DRAFT public.jobs rows.
# It never approves, activates, or publishes anything. See README "BLS wage synchronization".

on:
  schedule:
    # GitHub cron is UTC. Midnight America/New_York on the 1st is 04:00 UTC (EDT) or
    # 05:00 UTC (EST); the guard step below lets only the run at local midnight proceed.
    - cron: '0 4 1 * *'
    - cron: '0 5 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: show proposed updates without modifying Supabase'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bls-oews-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync BLS OEWS wages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Only run at midnight America/New_York (scheduled runs)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=America/New_York date +%H)" != "00" ]; then
            echo "Not midnight in America/New_York; skipping this duplicate schedule."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/bls_oews/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r integrations/bls_oews/requirements.txt

      - name: Run importer tests
        if: steps.guard.outputs.run == 'true'
        run: python -m pytest integrations/bls_oews/tests -q

      - name: Verify required secrets (live runs)
        if: steps.guard.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not configured (Settings > Secrets and variables > Actions)."
              missing=1
            fi
          done
          exit $missing

      - name: Sync wages
        if: steps.guard.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--summary-file "$GITHUB_STEP_SUMMARY")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m integrations.bls_oews.bls_oews_sync "${args[@]}"
